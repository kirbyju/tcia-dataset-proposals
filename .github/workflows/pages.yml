name: Publish TCIA reference guides

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/build_label_catalog.py'
      - 'tcia_proposals/resources/label_catalog.json'
      - 'tcia_proposals/resources/proposal_data_model.json'
      - 'scripts/import_public_label_catalog.py'
      - 'scripts/refresh_label_catalog.py'
      - 'tests/test_label_refresh.py'
      - 'scripts/export_catalog_dataset_labels.py'
      - 'scripts/label_catalog_template.html'
      - 'scripts/build_supporting_data_guide.py'
      - 'scripts/build_supporting_data_workbooks.mjs'
      - 'scripts/verify_supporting_data_workbooks.py'
      - 'scripts/supporting_data/**'
      - 'tests/test_supporting_data_guide.py'
      - 'skills/curate-tcia-wordpress-metadata/references/labeling-policy.json'
      - 'skills/curate-tcia-wordpress-metadata/references/label-mappings.json'
      - 'skills/curate-tcia-wordpress-metadata/references/label-decisions.json'
      - 'skills/curate-tcia-wordpress-metadata/references/label-reference-links.json'
      - 'skills/curate-tcia-wordpress-metadata/references/wordpress-label-inventory-*.json'
      - 'skills/curate-tcia-wordpress-metadata/references/wordpress-dataset-label-inventory-*.json'
      - 'skills/curate-tcia-wordpress-metadata/assets/tcia-labeling-guide.svg'
      - 'skills/curate-tcia-wordpress-metadata/assets/tcia-logo-light.svg'
      - '.github/workflows/pages.yml'
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Verify generated catalog is current
        run: |
          python3 scripts/build_label_catalog.py
          git diff --exit-code -- docs/labels
      - name: Verify supporting-data guide and downloads
        run: |
          python3 scripts/build_supporting_data_guide.py
          python3 scripts/verify_supporting_data_workbooks.py
          python3 -m unittest discover -s tests -p test_supporting_data_guide.py
          git diff --exit-code -- docs/supporting-data
      - name: Test catalog refresh integrity and decisions
        run: |
          python3 -m unittest discover -s tests -p test_label_refresh.py
          python3 -m unittest discover -s tests -p test_label_catalog_decisions.py
          python3 -m unittest discover -s tests -p test_catalog_dataset_labels.py
      - name: Refresh public data models
        run: |
          python3 scripts/refresh_label_catalog.py --output "$RUNNER_TEMP/catalog-current.json"
          python3 scripts/build_label_catalog.py --live-inventory "$RUNNER_TEMP/catalog-current.json"
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4
